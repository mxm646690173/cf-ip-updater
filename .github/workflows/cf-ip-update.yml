name: CF优选IP自动更新

on:
  # 定时执行：每6小时运行一次
  schedule:
    - cron: '0 */6 * * *'
  # 支持手动触发
  workflow_dispatch:

jobs:
  update-ip:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install chromium

      - name: 从源站获取电信优选IP并推送
        env:
          CFNEW_URL: ${{ secrets.CFNEW_URL }}
          CFNEW_PORT: ${{ secrets.CFNEW_PORT || '443' }}
          CFNEW_NAME: ${{ secrets.CFNEW_NAME || 'ip优选' }}
          WAIT_TIMEOUT: ${{ secrets.WAIT_TIMEOUT || '90' }}
        run: |
          python update_ip.py