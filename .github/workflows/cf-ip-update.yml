name: CF优选IP自动更新

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-ip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 更新优选IP
        env:
          CFNEW_URL: ${{ secrets.CFNEW_URL }}
        run: |
          python update_ip.py

      - name: 提交状态文件
        run: |
          git config user.name "cf-ip-updater[bot]"
          git config user.email "cf-ip-updater[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: 更新运行状态 [skip ci]"
          git push
